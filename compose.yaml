name: reviewfold

services:
  postgresql:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reviewfold
      POSTGRES_PASSWORD: reviewfold
      POSTGRES_USER: reviewfold
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - reviewfold-postgresql-data:/var/lib/postgresql
      - ./infra/postgresql/initialize-databases.sql:/docker-entrypoint-initdb.d/initialize-databases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s

volumes:
  reviewfold-postgresql-data:
    name: reviewfold-postgresql-data
